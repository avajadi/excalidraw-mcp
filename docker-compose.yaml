# The relay + web companion app as one service — it also serves MCP itself,
# directly over HTTP at /mcp. Point Claude at it with:
#   claude mcp add --transport http excalidraw http://localhost:3030/mcp
services:
  relay:
    build: .
    image: excalidraw-mcp-relay
    container_name: excalidraw-relay
    # Bind to localhost only — the scene API, WebSocket, and MCP endpoint are unauthenticated.
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      RELAY_PORT: "3030"
      EXCALIDRAW_OUTPUT_DIR: /data
      # If you bind-mount a host directory below, set this to that host path so the
      # relay can report host-absolute file paths (e.g. for export_scene). A
      # container can't discover its own bind-mount source, so it must be told.
      #   EXCALIDRAW_HOST_DIR: /home/you/excalidraw/scenes
    volumes:
      # Default: a Docker-managed named volume (declared under top-level `volumes:`).
      - excalidraw-scenes:/data
      # To keep scenes in a host directory instead, replace the line above with a
      # bind mount here (host:container) — do NOT put the host path under the
      # top-level `volumes:` block, that only takes a name + driver opts:
      #   - /home/you/excalidraw/scenes:/data
      # and add `user: "1000:1000"` (your uid:gid) so the files stay yours, and set
      # EXCALIDRAW_HOST_DIR above to the same host path.
    restart: unless-stopped

volumes:
  excalidraw-scenes: